<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Clinic Daily Login Data</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --royal-green: #09472e;
            --royal-green-light: #12724c;
            --royal-pink: #d81b60;
            --royal-pink-light: #f06292;
            --bg-color: #f4f6f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #fce4ec 100%);
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.1),
                inset 0 0 0 2px var(--royal-green-light),
                0 20px 50px rgba(216, 27, 96, 0.15);
            transform-style: preserve-3d;
        }

        h1 {
            text-align: center;
            color: var(--royal-green);
            font-size: 2.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 
                2px 2px 0px #fff,
                4px 4px 0px rgba(0,0,0,0.15),
                6px 6px 0px var(--royal-pink-light);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 900;
            color: var(--royal-green);
            font-size: 1.1em;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        input[type="file"], select {
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border: 2px solid var(--royal-green-light);
            border-radius: 10px;
            background: #fff;
            color: var(--royal-green);
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.1),
                4px 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            outline: none;
        }

        input[type="file"]:hover, select:hover {
            border-color: var(--royal-pink);
            box-shadow: 
                inset 2px 2px 5px rgba(0,0,0,0.1),
                6px 6px 15px rgba(216, 27, 96, 0.3);
            transform: translateY(-2px);
        }

        select {
            min-width: 250px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin-top: 20px;
            background: white;
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: linear-gradient(180deg, var(--royal-green) 0%, var(--royal-green-light) 100%);
            color: white;
            font-size: 1.2em;
            font-weight: 900;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            border: 1px solid var(--royal-green);
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #fce4ec;
            transform: scale(1.01);
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.1);
            position: relative;
            z-index: 10;
            font-weight: bold;
        }

        td {
            font-size: 1.1em;
            color: #444;
            border-right: 1px solid #eee;
        }

        td:last-child {
            border-right: none;
        }
        
        .date-col {
            color: var(--royal-green);
            font-weight: bold;
        }
        
        .time-col {
            color: var(--royal-pink);
            font-weight: bold;
        }

        .loader {
            display: none;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--royal-pink);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>E-Clinic Daily Login</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="fileUpload">1. Upload File (Excel / CSV)</label>
            <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv">
        </div>
        
        <div class="control-group">
            <label for="regionSelect">2. Select Region</label>
            <select id="regionSelect" disabled>
                <option value="">-- Upload file first --</option>
            </select>
        </div>
    </div>

    <div class="loader" id="loader">Processing file... Please wait.</div>

    <div class="table-container" id="tableContainer">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Clinic Name</th>
                    <th>Date</th>
                    <th>Login ID</th>
                    <th>Login Time</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will appear here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let globalData = [];

    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loader').style.display = 'block';
        document.getElementById('tableContainer').style.display = 'none';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Convert to array of arrays
            const json = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'yyyy-mm-dd hh:mm:ss'});
            
            processExcelData(json);
        };
        reader.readAsArrayBuffer(file);
    });

    function processExcelData(rows) {
        let headerRowIndex = -1;
        
        // Find the header row by looking for 'Clinic Name'
        for (let i = 0; i < rows.length; i++) {
            if (rows[i] && rows[i].some(cell => typeof cell === 'string' && cell.toLowerCase().includes('clinic name'))) {
                headerRowIndex = i;
                break;
            }
        }

        if (headerRowIndex === -1) {
            alert("Could not find 'Clinic Name' column in the uploaded file.");
            document.getElementById('loader').style.display = 'none';
            return;
        }

        const headers = rows[headerRowIndex].map(h => typeof h === 'string' ? h.toLowerCase().trim() : '');
        
        const clinicIdx = headers.findIndex(h => h.includes('clinic name'));
        const loginIdIdx = headers.findIndex(h => h.includes('login id'));
        const loginTimeIdx = headers.findIndex(h => h.includes('login time'));

        if (clinicIdx === -1 || loginIdIdx === -1 || loginTimeIdx === -1) {
            alert("Missing required columns: Clinic Name, Login Id, or Login Time.");
            document.getElementById('loader').style.display = 'none';
            return;
        }

        globalData = [];
        const regionsSet = new Set();

        for (let i = headerRowIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || !row[clinicIdx]) continue; // Skip empty rows

            const clinicName = (row[clinicIdx] || '').toString().trim();
            const loginId = (row[loginIdIdx] || '').toString().trim();
            const rawLoginTime = (row[loginTimeIdx] || '').toString().trim();

            if (!clinicName) continue;

            // Extract Region (last word of clinic name)
            const parts = clinicName.split(' ');
            const region = parts.length > 1 ? parts[parts.length - 1].toUpperCase() : 'UNKNOWN';
            
            // Format Date and Time
            let dateStr = '';
            let timeStr = '';
            
            if (rawLoginTime) {
                // If it looks like 'YYYY-MM-DD HH:MM:SS'
                const splitTime = rawLoginTime.split(' ');
                if (splitTime.length >= 2) {
                    dateStr = splitTime[0];
                    timeStr = splitTime.slice(1).join(' ');
                } else {
                    dateStr = rawLoginTime;
                    timeStr = '-';
                }
            }

            regionsSet.add(region);
            
            globalData.push({
                region: region,
                clinicName: clinicName,
                loginId: loginId,
                date: dateStr,
                time: timeStr
            });
        }

        // Populate Region Dropdown
        const regionSelect = document.getElementById('regionSelect');
        regionSelect.innerHTML = '<option value="">-- Select Region --</option>';
        
        const sortedRegions = Array.from(regionsSet).sort();
        sortedRegions.forEach(reg => {
            const opt = document.createElement('option');
            opt.value = reg;
            opt.textContent = reg;
            regionSelect.appendChild(opt);
        });

        regionSelect.disabled = false;
        document.getElementById('loader').style.display = 'none';
        
        alert("File processed successfully! Please select a region.");
    }

    document.getElementById('regionSelect').addEventListener('change', function(e) {
        const selectedRegion = e.target.value;
        const tableBody = document.getElementById('tableBody');
        const tableContainer = document.getElementById('tableContainer');
        
        tableBody.innerHTML = '';
        
        if (!selectedRegion) {
            tableContainer.style.display = 'none';
            return;
        }

        // Filter and Sort A to Z
        const filteredData = globalData
            .filter(item => item.region === selectedRegion)
            .sort((a, b) => a.clinicName.localeCompare(b.clinicName));

        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">No records found for this region.</td></tr>';
        } else {
            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                
                const tdClinic = document.createElement('td');
                tdClinic.textContent = item.clinicName;
                
                const tdDate = document.createElement('td');
                tdDate.textContent = item.date;
                tdDate.className = 'date-col';
                
                const tdLoginId = document.createElement('td');
                tdLoginId.textContent = item.loginId;
                
                const tdTime = document.createElement('td');
                tdTime.textContent = item.time;
                tdTime.className = 'time-col';
                
                tr.appendChild(tdClinic);
                tr.appendChild(tdDate);
                tr.appendChild(tdLoginId);
                tr.appendChild(tdTime);
                
                tableBody.appendChild(tr);
            });
        }
        
        tableContainer.style.display = 'block';
    });
</script>
</body>
</html>
