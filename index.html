<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Clinic Daily Login Dashboard</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SheetJS for Excel Reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-accent: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.4);
            --secondary-accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --table-hover: #26334d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 20px var(--primary-glow);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 500;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .control-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .control-card:hover {
            border-color: var(--primary-accent);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label i {
            color: var(--primary-accent);
        }

        /* Custom File Input Styling */
        .file-upload-wrapper {
            position: relative;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-muted);
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 15px;
            transition: opacity 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            opacity: 0.9;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-dark);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus:enabled {
            border-color: var(--primary-accent);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loader */
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            font-weight: 600;
            color: var(--primary-accent);
            font-size: 1.1rem;
        }

        .loader i {
            margin-right: 8px;
        }

        /* Table Styling */
        .table-container {
            display: none;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #0f172a;
            color: var(--primary-accent);
            padding: 18px 24px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
        }

        td {
            padding: 16px 24px;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-weight: 500;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: var(--table-hover);
        }

        /* Specialized Column Badges */
        .clinic-col {
            font-weight: 700;
            color: #ffffff;
        }

        .date-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .id-badge {
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.95rem;
        }

        .time-badge {
            display: inline-block;
            background: rgba(6, 182, 212, 0.15);
            color: #22d3ee;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.88rem;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-laptop-medical"></i> E-Clinic Daily Login</h1>
        <p>Upload daily reports and filter login records by region</p>
    </div>
    
    <div class="controls-grid">
        <div class="control-card">
            <label for="fileUpload"><i class="fa-solid fa-file-excel"></i> 1. Upload Report (Excel / CSV)</label>
            <div class="file-upload-wrapper">
                <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv">
            </div>
        </div>
        
        <div class="control-card">
            <label for="regionSelect"><i class="fa-solid fa-location-dot"></i> 2. Select Region</label>
            <select id="regionSelect" disabled>
                <option value="">-- Upload file first --</option>
            </select>
        </div>
    </div>

    <div class="loader" id="loader">
        <i class="fa-solid fa-circle-notch fa-spin"></i> Processing Data... Please wait.
    </div>

    <div class="table-container" id="tableContainer">
        <table id="dataTable">
            <thead>
                <tr>
                    <th><i class="fa-solid fa-hospital me-1"></i> Clinic Name</th>
                    <th><i class="fa-solid fa-calendar-day me-1"></i> Date</th>
                    <th><i class="fa-solid fa-user-gear me-1"></i> Login ID</th>
                    <th><i class="fa-solid fa-clock me-1"></i> Login Time</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data populated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let globalData = [];

    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loader').style.display = 'block';
        document.getElementById('tableContainer').style.display = 'none';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const json = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'yyyy-mm-dd hh:mm:ss'});
            
            processExcelData(json);
        };
        reader.readAsArrayBuffer(file);
    });

    function processExcelData(rows) {
        let headerRowIndex = -1;
        
        for (let i = 0; i < rows.length; i++) {
            if (rows[i] && rows[i].some(cell => typeof cell === 'string' && cell.toLowerCase().includes('clinic name'))) {
                headerRowIndex = i;
                break;
            }
        }

        if (headerRowIndex === -1) {
            alert("Could not find 'Clinic Name' column in the uploaded file.");
            document.getElementById('loader').style.display = 'none';
            return;
        }

        const headers = rows[headerRowIndex].map(h => typeof h === 'string' ? h.toLowerCase().trim() : '');
        
        const clinicIdx = headers.findIndex(h => h.includes('clinic name'));
        const loginIdIdx = headers.findIndex(h => h.includes('login id'));
        const loginTimeIdx = headers.findIndex(h => h.includes('login time'));

        if (clinicIdx === -1 || loginIdIdx === -1 || loginTimeIdx === -1) {
            alert("Missing required columns: Clinic Name, Login Id, or Login Time.");
            document.getElementById('loader').style.display = 'none';
            return;
        }

        globalData = [];
        const regionsSet = new Set();

        for (let i = headerRowIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || !row[clinicIdx]) continue;

            const clinicName = (row[clinicIdx] || '').toString().trim();
            const loginId = (row[loginIdIdx] || '').toString().trim();
            const rawLoginTime = (row[loginTimeIdx] || '').toString().trim();

            if (!clinicName) continue;

            const parts = clinicName.split(' ');
            const region = parts.length > 1 ? parts[parts.length - 1].toUpperCase() : 'UNKNOWN';
            
            let dateStr = '';
            let timeStr = '';
            
            if (rawLoginTime) {
                const splitTime = rawLoginTime.split(' ');
                if (splitTime.length >= 2) {
                    dateStr = splitTime[0];
                    timeStr = splitTime.slice(1).join(' ');
                } else {
                    dateStr = rawLoginTime;
                    timeStr = '-';
                }
            }

            regionsSet.add(region);
            
            globalData.push({
                region: region,
                clinicName: clinicName,
                loginId: loginId,
                date: dateStr,
                time: timeStr
            });
        }

        const regionSelect = document.getElementById('regionSelect');
        regionSelect.innerHTML = '<option value="">-- Select Region --</option>';
        
        const sortedRegions = Array.from(regionsSet).sort();
        sortedRegions.forEach(reg => {
            const opt = document.createElement('option');
            opt.value = reg;
            opt.textContent = reg;
            regionSelect.appendChild(opt);
        });

        regionSelect.disabled = false;
        document.getElementById('loader').style.display = 'none';
    }

    document.getElementById('regionSelect').addEventListener('change', function(e) {
        const selectedRegion = e.target.value;
        const tableBody = document.getElementById('tableBody');
        const tableContainer = document.getElementById('tableContainer');
        
        tableBody.innerHTML = '';
        
        if (!selectedRegion) {
            tableContainer.style.display = 'none';
            return;
        }

        const filteredData = globalData
            .filter(item => item.region === selectedRegion)
            .sort((a, b) => a.clinicName.localeCompare(b.clinicName));

        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444; padding: 25px;">No records found for this region.</td></tr>';
        } else {
            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                
                const tdClinic = document.createElement('td');
                tdClinic.textContent = item.clinicName;
                tdClinic.className = 'clinic-col';
                
                const tdDate = document.createElement('td');
                tdDate.innerHTML = `<span class="date-badge">${item.date}</span>`;
                
                const tdLoginId = document.createElement('td');
                tdLoginId.innerHTML = `<span class="id-badge">${item.loginId}</span>`;
                
                const tdTime = document.createElement('td');
                tdTime.innerHTML = `<span class="time-badge">${item.time}</span>`;
                
                tr.appendChild(tdClinic);
                tr.appendChild(tdDate);
                tr.appendChild(tdLoginId);
                tr.appendChild(tdTime);
                
                tableBody.appendChild(tr);
            });
        }
        
        tableContainer.style.display = 'block';
    });
</script>
</body>
</html>
