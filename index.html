<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Clinic Daily Login Dashboard</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SheetJS for Excel Reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --header-bg: #1e293b;
            --header-text: #ffffff;
            --border-color: #cbd5e1;
            --text-dark: #0f172a;
            --accent-blue: #0284c7;
            --hover-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .main-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid var(--accent-blue);
            padding-bottom: 10px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-card {
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        label {
            display: block;
            font-weight: 800;
            color: #1e293b;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 2px solid #94a3b8;
            border-radius: 6px;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            cursor: pointer;
        }

        input[type="file"]:hover, select:hover {
            border-color: var(--accent-blue);
        }

        select:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
        }

        /* Loader */
        .loader {
            display: none;
            text-align: center;
            padding: 15px;
            font-weight: 800;
            color: var(--accent-blue);
            font-size: 1.3rem;
        }

        /* Table Styling - Light, High Contrast, Large Text */
        .table-container {
            display: none;
            overflow-x: auto;
            border: 2px solid #0f172a;
            border-radius: 6px;
            margin-top: 15px;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 14px 10px;
            font-weight: 800;
            font-size: 1.15rem;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        td {
            padding: 12px 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            white-space: nowrap;
        }

        /* Column Specific Alignments & Colors */
        .clinic-col {
            text-align: left !important;
            font-weight: 800 !important;
            color: #000000 !important;
            padding-left: 15px;
        }

        .ip-col {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
        }

        .count-col {
            font-size: 1.2rem;
            color: #0369a1;
            font-weight: 800;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tr:hover {
            background-color: #bae6fd; /* Bright Highlight on hover */
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="main-title"><i class="fa-solid fa-clinic-medical"></i> E-Clinic Daily Login Report</h1>
    
    <div class="controls-grid">
        <div class="control-card">
            <label for="fileUpload">1. Upload Report (Excel / CSV)</label>
            <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv">
        </div>
        
        <div class="control-card">
            <label for="regionSelect">2. Select Region</label>
            <select id="regionSelect" disabled>
                <option value="">-- Upload file first --</option>
            </select>
        </div>
    </div>

    <div class="loader" id="loader">
        <i class="fa-solid fa-spinner fa-spin"></i> Processing file... Please wait.
    </div>

    <div class="table-container" id="tableContainer">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Clinic Name</th>
                    <th>Login Id</th>
                    <th>Login Time</th>
                    <th>Logout Time</th>
                    <th>IP</th>
                    <th>Consultation Count</th>
                    <th>Policy Count</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data dynamically inserted here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let globalData = [];

    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loader').style.display = 'block';
        document.getElementById('tableContainer').style.display = 'none';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const json = XLSX.utils.sheet_to_json(worksheet, {header: 1, raw: false, dateNF: 'dd-mm-yy hh:mm'});
            
            processExcelData(json);
        };
        reader.readAsArrayBuffer(file);
    });

    function processExcelData(rows) {
        let headerRowIndex = -1;
        
        // Header Row Search
        for (let i = 0; i < rows.length; i++) {
            if (rows[i] && rows[i].some(cell => typeof cell === 'string' && cell.toLowerCase().includes('clinic name'))) {
                headerRowIndex = i;
                break;
            }
        }

        if (headerRowIndex === -1) {
            alert("Could not find 'Clinic Name' column in the uploaded file.");
            document.getElementById('loader').style.display = 'none';
            return;
        }

        const headers = rows[headerRowIndex].map(h => typeof h === 'string' ? h.toLowerCase().trim() : '');
        
        // Find Column Indexes
        const clinicIdx = headers.findIndex(h => h.includes('clinic name'));
        const loginIdIdx = headers.findIndex(h => h.includes('login id'));
        const loginTimeIdx = headers.findIndex(h => h.includes('login time'));
        const logoutTimeIdx = headers.findIndex(h => h.includes('logout time'));
        const ipIdx = headers.findIndex(h => h.includes('ip'));
        const consultIdx = headers.findIndex(h => h.includes('consultation count'));
        const policyIdx = headers.findIndex(h => h.includes('policy count'));

        globalData = [];
        const regionsSet = new Set();

        for (let i = headerRowIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || !row[clinicIdx]) continue;

            const clinicName = (row[clinicIdx] || '').toString().trim();
            if (!clinicName) continue;

            // Region extraction (last word of clinic name)
            const parts = clinicName.split(' ');
            const region = parts.length > 1 ? parts[parts.length - 1].toUpperCase() : 'UNKNOWN';

            regionsSet.add(region);
            
            globalData.push({
                region: region,
                clinicName: clinicName,
                loginId: loginIdIdx !== -1 ? (row[loginIdIdx] || '-').toString().trim() : '-',
                loginTime: loginTimeIdx !== -1 ? (row[loginTimeIdx] || '-').toString().trim() : '-',
                logoutTime: logoutTimeIdx !== -1 ? (row[logoutTimeIdx] || '-').toString().trim() : '-',
                ip: ipIdx !== -1 ? (row[ipIdx] || '-').toString().trim() : '-',
                consultCount: consultIdx !== -1 ? (row[consultIdx] || '0').toString().trim() : '0',
                policyCount: policyIdx !== -1 ? (row[policyIdx] || '0').toString().trim() : '0'
            });
        }

        // Region Dropdown
        const regionSelect = document.getElementById('regionSelect');
        regionSelect.innerHTML = '<option value="">-- Select Region --</option>';
        
        const sortedRegions = Array.from(regionsSet).sort();
        sortedRegions.forEach(reg => {
            const opt = document.createElement('option');
            opt.value = reg;
            opt.textContent = reg;
            regionSelect.appendChild(opt);
        });

        regionSelect.disabled = false;
        document.getElementById('loader').style.display = 'none';
    }

    document.getElementById('regionSelect').addEventListener('change', function(e) {
        const selectedRegion = e.target.value;
        const tableBody = document.getElementById('tableBody');
        const tableContainer = document.getElementById('tableContainer');
        
        tableBody.innerHTML = '';
        
        if (!selectedRegion) {
            tableContainer.style.display = 'none';
            return;
        }

        const filteredData = globalData
            .filter(item => item.region === selectedRegion)
            .sort((a, b) => a.clinicName.localeCompare(b.clinicName));

        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red; padding: 20px;">No records found for this region.</td></tr>';
        } else {
            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td class="clinic-col">${item.clinicName}</td>
                    <td>${item.loginId}</td>
                    <td>${item.loginTime}</td>
                    <td>${item.logoutTime}</td>
                    <td class="ip-col">${item.ip}</td>
                    <td class="count-col">${item.consultCount}</td>
                    <td class="count-col">${item.policyCount}</td>
                `;
                
                tableBody.appendChild(tr);
            });
        }
        
        tableContainer.style.display = 'block';
    });
</script>
</body>
</html>
